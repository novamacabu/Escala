<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Escala Cuidadores 2026 v3</title>
<style>
:root{--bg:#0b0b10;--surface:#13131c;--card:#1a1a28;--border:#252535;--border2:#32324a;--text:#e8e4f0;--muted:#5a576e;--accent:#d4a843;--paid-color:#2e7d52;--pend-color:#8b2020;--paid-light:#4caf7d;--pend-light:#e05555;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Georgia Pro','Georgia',serif;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;touch-action:pan-y;transition:background .2s,color .2s;}
body.light{--bg:#ffffff;--surface:#f2f2f2;--card:#ffffff;--border:#d0d0d0;--border2:#a0a0a0;--text:#111111;--muted:#555555;--accent:#9a6800;--paid-color:#1a6b3a;--pend-color:#8b0000;--paid-light:#1e8449;--pend-light:#c0392b;}
body.light .sync-banner{background:#f0f0f0;color:#333;border-bottom:1px solid #d0d0d0;}
body.light .top-bar{background:#fff;}
body.light .cloud-badge{background:rgba(154,104,0,.08);border-color:rgba(154,104,0,.25);color:#9a6800;}
body.light .tbtn{background:#f2f2f2;border-color:#d0d0d0;color:#333;}
body.light .hdr{background:#fff;border-bottom:1px solid #d0d0d0;}
body.light .month{color:#9a6800!important;}
body.light .yr{color:#555!important;}
body.light .leg-bar{background:#fff;border-bottom:1px solid #d0d0d0;}
body.light .leg{color:#111;}
body.light .shift-info{background:#fff;color:#555;border-bottom:1px solid #d0d0d0;}
body.light .hint{color:#888;background:#fff;}
body.light .cal-wrap{background:#fff;}
body.light .month-block{background:#fff;}
body.light .filter-bar{background:#fff;border-bottom:1px solid #d0d0d0;}
body.light .cell{background:#fff!important;border-color:#e0e0e0!important;}
body.light .cell.empty{background:#f5f5f5!important;}
body.light .cell.today{background:#fffbef!important;border-color:var(--accent)!important;box-shadow:inset 0 0 0 1px var(--accent),0 0 12px rgba(154,104,0,.1)!important;}
body.light .day-hdr{background:#f0f0f0!important;color:#555!important;}
body.light .day-hdr.dom{color:#c0392b!important;}
body.light .day-num{color:#333!important;}
body.light .day-dow{color:#666!important;}
body.light .htag{color:#c0392b;background:rgba(192,57,43,.08);}
body.light .add-btn{color:#aaa;border-color:#ccc;}
body.light .add-comment-btn{color:#888;}
body.light .comment-bubble{background:rgba(154,104,0,.06);border-color:rgba(154,104,0,.2);}
body.light .comment-bubble .cb-text{color:#555!important;}
body.light .badge{box-shadow:0 1px 4px rgba(0,0,0,.1);}
body.light .cell{box-shadow:0 1px 3px rgba(0,0,0,.06);}
body.light .day-num{color:#555!important;}
body.light .shift-divider{background:#d0d0d0;}
body.light::after{display:none;}
body.light,html:has(body.light){background:#fff !important;}
body.light .month-block{background:#fff;}
body.light .cal-wrap{background:#fff;}
body.light .hint{background:#fff;color:#999;}
body.light .calendar{background:#fff;}
body.light .shift-info{background:#fff;}
body.light #calendars-container{background:#fff;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9000;}
.sync-banner{display:flex;align-items:center;gap:8px;padding:8px 18px;font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);}
.sync-banner .sb-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s;}
.sync-banner.synced .sb-dot{background:var(--paid-light);box-shadow:0 0 6px var(--paid-light);}
.sync-banner.syncing .sb-dot{background:var(--accent);box-shadow:0 0 6px var(--accent);animation:pulse 1s infinite;}
.sync-banner.error .sb-dot{background:var(--pend-light);}
.sync-banner.synced{color:var(--paid-light);}
.sync-banner.syncing{color:var(--accent);}
.sync-banner.error{color:var(--pend-light);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;gap:8px;flex-wrap:wrap;}
.top-bar-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.tbtn{display:flex;align-items:center;gap:5px;font-family:'Georgia Pro','Georgia',serif;font-size:10px;letter-spacing:.8px;padding:7px 12px;border-radius:20px;cursor:pointer;transition:background .15s;user-select:none;border:1px solid;}
.tbtn-pub{background:var(--paid-color);border-color:var(--paid-light);color:#e8f5ee;}
.tbtn-pub:disabled{opacity:.4;cursor:not-allowed;}
.tbtn-print{background:var(--border2);border-color:var(--border);color:var(--text);}
.tbtn-share{background:rgba(139,114,245,.12);border-color:rgba(139,114,245,.3);color:#a99ef5;}
.tbtn-cfg{background:rgba(212,168,67,.08);border-color:rgba(212,168,67,.22);color:var(--accent);}
.tbtn-theme{background:var(--surface);border-color:var(--border);color:var(--muted);}
.tbtn-summary{background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.3);color:#60a5fa;}
.cloud-badge{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--accent);background:rgba(212,168,67,.08);border:1px solid rgba(212,168,67,.2);border-radius:20px;padding:5px 10px;}
.filter-bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px;border-bottom:1px solid var(--border);align-items:center;}
.filter-bar-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
.filter-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:10px;font-family:'Georgia Pro','Georgia',serif;font-weight:700;cursor:pointer;border:1.5px solid transparent;transition:all .15s;user-select:none;opacity:.5;}
.filter-chip.active{opacity:1;}
.hdr{padding:10px 18px 16px;display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--border)}
.month{font-family:'Georgia Pro','Georgia',serif;font-size:clamp(38px,10vw,68px);font-weight:800;color:var(--accent);letter-spacing:-2px;line-height:1}
.yr{font-size:11px;letter-spacing:4px;color:var(--muted);padding-bottom:7px}
.leg-bar{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 18px;border-bottom:1px solid var(--border)}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:1px;text-transform:uppercase}
.ldot{width:9px;height:9px;border-radius:50%}
.shift-info{display:flex;gap:16px;padding:7px 18px;border-bottom:1px solid var(--border);font-size:10px;color:var(--muted);}
.sdot{width:7px;height:7px;border-radius:50%}
.hint{text-align:center;font-size:9px;letter-spacing:2px;color:var(--muted);padding:7px;text-transform:uppercase}
.month-block{margin-bottom:32px;}
.cal-wrap{padding:0 8px 8px;overflow-x:auto}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(116px,1fr));gap:3px;min-width:700px}
.day-hdr{background:var(--surface);text-align:center;padding:9px 4px;font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;font-weight:700;}
.day-hdr.dom{color:#e57272;}
.cell{background:var(--card);min-height:120px;padding:8px 7px 6px;display:flex;flex-direction:column;gap:4px;position:relative;border:1.5px solid transparent;transition:background .15s,border-color .15s;}
.cell.empty{background:var(--surface);opacity:.22;pointer-events:none;}
.cell.today{background:#14142a;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.cell.dom .day-num{color:#e57272;}
.cell.today .day-num{color:var(--accent);}
.cell.today .day-dow{color:var(--accent);opacity:.9;}
.cell.drag-over{background:#1c1c38;box-shadow:inset 0 0 0 2px rgba(212,168,67,.4);}
.cell.conflict::before{content:'⚠';position:absolute;top:5px;right:6px;font-size:10px;opacity:.6;color:#f5a87c;}
.day-num{font-family:'Georgia Pro','Georgia',serif;font-size:20px;font-weight:800;color:var(--muted);line-height:1;pointer-events:none;}
.day-dow{font-size:9px;color:var(--muted);opacity:.55;letter-spacing:.5px;pointer-events:none;text-transform:uppercase;margin-top:1px;}
.cell.dom .day-dow{color:#e57272;opacity:.75;}
.shift-divider{height:1px;background:var(--border);margin:2px 0;opacity:.5;}
.htag{font-size:8px;letter-spacing:.8px;text-transform:uppercase;color:#e57272;background:rgba(229,114,114,.1);border-radius:3px;padding:2px 5px;pointer-events:none}
.add-btn{margin-top:auto;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--border2);border:1px dashed var(--border2);border-radius:20px;padding:3px 0;text-align:center;cursor:pointer;transition:color .2s;user-select:none}
.add-btn:hover{color:var(--accent);border-color:var(--accent)}
.comment-bubble{display:flex;align-items:flex-start;gap:5px;background:rgba(212,168,67,.07);border:1px solid rgba(212,168,67,.18);border-radius:8px;padding:5px 7px;margin-top:1px;cursor:pointer;}
.comment-bubble .cb-icon{font-size:9px;flex-shrink:0;opacity:.7;}
.comment-bubble .cb-text{font-size:9px;color:rgba(232,228,240,.65);line-height:1.4;word-break:break-word;flex:1;}
.comment-bubble .cb-edit{font-size:8px;color:var(--accent);opacity:0;transition:opacity .15s;}
.comment-bubble:hover .cb-edit{opacity:1;}
.add-comment-btn{font-size:8px;text-transform:uppercase;color:var(--muted);opacity:.45;cursor:pointer;padding:1px 0;transition:opacity .2s;user-select:none;display:flex;align-items:center;gap:3px;}
.add-comment-btn:hover{opacity:1;color:var(--accent);}
.badge{display:flex;align-items:center;gap:5px;padding:5px 9px 5px 5px;border-radius:30px;font-size:12px;font-weight:700;font-family:'Georgia Pro','Georgia',serif;cursor:grab;user-select:none;border:2px solid transparent;touch-action:none;transition:opacity .15s,transform .15s,box-shadow .15s;}
.badge:hover{box-shadow:0 2px 8px rgba(0,0,0,.15);transform:translateY(-1px);}
.badge:active{cursor:grabbing;transform:scale(.94);}
.badge.dragging{opacity:.35;transform:scale(.94)}
.badge.dimmed{opacity:.15;pointer-events:none;filter:grayscale(.5);}
.badge .av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;border:2px solid rgba(255,255,255,.4);}
.badge .bnm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.badge .stg{font-size:9px;color:var(--muted);flex-shrink:0;opacity:.8;}
#ghost{position:fixed;pointer-events:none;z-index:9500;display:none;opacity:.88;transform:scale(1.08);box-shadow:0 16px 48px rgba(0,0,0,.55);border-radius:30px;padding:5px 12px;font-family:'Georgia Pro','Georgia',serif;font-size:12px;font-weight:700;white-space:nowrap}
.overlay{position:fixed;inset:0;z-index:8000;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:#16162a;border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:20px 20px 36px;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,1,.4,1);border-top:1px solid var(--border2);max-height:90vh;overflow-y:auto;}
body.light .sheet{background:#f0ede4;}
.overlay.open .sheet{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 18px}
.sheet-title{font-family:'Georgia Pro','Georgia',serif;font-size:16px;font-weight:700;color:var(--accent);margin-bottom:16px;}
.sheet-day-label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.action-list{display:flex;flex-direction:column;gap:8px}
.action-btn{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'Georgia Pro','Georgia',serif;font-size:12px;cursor:pointer;transition:background .15s;user-select:none}
.action-btn:hover{background:#20203a;}
.action-btn .ico{font-size:16px;width:24px;text-align:center}
.action-btn.danger{color:#f57272}
.action-btn.success{color:var(--paid-light)}
.action-btn.warn{color:var(--pend-light)}
.action-btn.wa{color:#25d366}
.action-btn .sub{font-size:9px;color:var(--muted);display:block;margin-top:1px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.person-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.person-opt{padding:10px 8px;border-radius:10px;text-align:center;background:var(--card);border:1.5px solid var(--border);font-family:'Georgia Pro','Georgia',serif;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s;user-select:none;position:relative;}
.shift-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shift-opt{padding:10px 8px;border-radius:10px;text-align:center;background:var(--card);border:1.5px solid var(--border);font-family:'Georgia Pro','Georgia',serif;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s;user-select:none;display:flex;align-items:center;justify-content:center;gap:6px}
.shift-opt.sel-D{border-color:#ffd54f;background:rgba(255,213,79,.1);color:#ffd54f}
.shift-opt.sel-N{border-color:#90caf9;background:rgba(144,202,249,.1);color:#90caf9}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay-opt{padding:10px 8px;border-radius:10px;text-align:center;background:var(--card);border:1.5px solid var(--border);font-family:'Georgia Pro','Georgia',serif;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s;user-select:none}
.pay-opt.sel-paid{border-color:var(--paid-light);background:rgba(46,125,82,.15);color:var(--paid-light)}
.pay-opt.sel-pend{border-color:var(--pend-light);background:rgba(139,32,32,.15);color:var(--pend-light)}
.confirm-btn{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#0b0b10;font-family:'Georgia Pro','Georgia',serif;font-size:14px;font-weight:800;border:none;cursor:pointer;margin-top:6px;transition:opacity .15s;}
.confirm-btn:hover{opacity:.88}
.confirm-btn:disabled{opacity:.35;cursor:not-allowed}
.cancel-btn{width:100%;padding:12px;border-radius:12px;background:transparent;color:var(--muted);font-family:'Georgia Pro','Georgia',serif;font-size:13px;font-weight:700;border:1px solid var(--border);cursor:pointer;margin-top:8px;}
.text-input{width:100%;padding:12px 14px;border-radius:10px;background:var(--card);border:1.5px solid var(--border2);color:var(--text);font-family:'Georgia Pro','Georgia',serif;font-size:14px;font-weight:700;outline:none;transition:border-color .15s;}
.text-input:focus{border-color:var(--accent);}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:4px;}
.color-swatch{width:100%;aspect-ratio:1;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s,transform .15s;}
.color-swatch.sel{border-color:#fff;transform:scale(1.15);}
.people-list{display:flex;flex-direction:column;gap:8px;}
.person-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border);}
.person-row .pr-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#0b0b10;flex-shrink:0;}
.person-row .pr-ico{font-size:18px;cursor:pointer;padding:4px;color:var(--muted);transition:color .15s;}
.person-row .pr-ico:hover{color:var(--accent);}
.person-row .pr-del:hover{color:var(--pend-light)!important;}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.summary-name{font-family:'Georgia Pro','Georgia',serif;font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.summary-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:4px 0;border-bottom:1px solid var(--border);}
.summary-row:last-child{border-bottom:none;}
.summary-row .sr-label{color:var(--muted);}
.summary-row .sr-val{font-family:'Georgia Pro','Georgia',serif;font-weight:700;}
.summary-row .sr-val.paid{color:var(--paid-light);}
.summary-row .sr-val.pend{color:var(--pend-light);}
.history-item{padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--border);margin-bottom:8px;}
.history-item .hi-time{font-size:9px;color:var(--muted);}
.history-item .hi-msg{font-size:11px;margin-top:3px;}
.wa-contact-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.wa-contact-row:last-child{border-bottom:none;}
.wa-contact-row input[type=tel]{background:var(--card);border:1px solid var(--border2);color:var(--text);font-family:'Georgia Pro','Georgia',serif;font-size:12px;padding:6px 10px;border-radius:8px;outline:none;width:140px;}
.confirm-overlay{position:fixed;inset:0;z-index:9200;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s;padding:24px;}
.confirm-overlay.open{opacity:1;pointer-events:all;}
.confirm-box{background:var(--card);border-radius:18px;padding:28px 24px 20px;width:100%;max-width:360px;border:1px solid var(--border2);text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3);}
.confirm-box .cb-ico{font-size:32px;margin-bottom:12px;}
.confirm-box .cb-title{font-family:'Georgia Pro','Georgia',serif;font-size:15px;font-weight:800;color:var(--text);margin-bottom:6px;}
.confirm-box .cb-sub{font-size:11px;color:var(--muted);margin-bottom:20px;line-height:1.5;}
.confirm-box .cb-sub b{color:var(--accent);}
body.light .confirm-box{background:#fff;border-color:#d0d0d0;}
body.light .cb-btns .cb-no{background:#f2f2f2;color:#555;}
.cb-btns{display:flex;gap:10px;}
.cb-btns button{flex:1;padding:12px;border-radius:12px;font-family:'Georgia Pro','Georgia',serif;font-size:13px;font-weight:800;border:none;cursor:pointer;}
.cb-btns .cb-yes{background:var(--accent);color:#0b0b10;}
.cb-btns .cb-no{background:var(--card);color:var(--muted);border:1px solid var(--border);}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--border2);color:var(--text);padding:9px 18px;border-radius:30px;font-size:11px;z-index:9800;transition:transform .3s ease;pointer-events:none;border:1px solid var(--border);white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}
footer{text-align:center;font-size:9px;letter-spacing:2px;color:var(--muted);padding:10px 10px 20px;text-transform:uppercase;opacity:.4}
textarea.text-input{resize:vertical;min-height:90px;line-height:1.5;}
select.text-input{cursor:pointer;}
@media print{
@page{size:A4 landscape;margin:8mm;}
html,body{background:#fff!important;color:#111!important;font-size:7px;}
body::after{display:none;}
.top-bar,.hint,.overlay,.confirm-overlay,#ghost,#toast,footer,.add-btn,.tbtn,.sync-banner,.cloud-badge,.filter-bar{display:none!important;}
.hdr{padding:4px 8px;border-bottom:1px solid #ccc;}
.month{font-size:28px!important;color:#c8960a!important;}
.cal-wrap{overflow:visible;}
.month-block{margin-bottom:0;page-break-after:always;page-break-inside:avoid;}
.month-block:last-child{page-break-after:auto;}
.calendar{min-width:unset;gap:1px;grid-template-columns:repeat(7,1fr);}
.day-hdr{background:#f0f0f0!important;color:#555!important;padding:3px 2px;font-size:7px;}
.cell{background:#fafafa!important;min-height:52px;padding:3px;gap:1px;border:1px solid #ddd!important;}
.cell.today{background:#fffbef!important;}
.cell.empty{background:#f5f5f5!important;opacity:.4;}
.day-num{font-size:10px!important;color:#aaa!important;}
.day-dow{font-size:6px!important;color:#aaa!important;}
.htag{font-size:6px;}
.badge{padding:2px 4px;font-size:7px;border-width:1px!important;}
.badge .av{width:13px;height:13px;font-size:6px;}
.badge .stg{font-size:6px;}
.badge.paid-print .bnm::after{content:' ✓';color:#1a5c32;font-weight:800;}
.badge.pend-print .bnm::after{content:' ✗';color:#7a1010;font-weight:800;}
.comment-bubble{padding:2px 4px;}
.comment-bubble .cb-text{color:#555!important;font-size:6px;}
.comment-bubble .cb-edit,.add-comment-btn{display:none!important;}
}
</style>
</head>
<body>
<div class="sync-banner syncing" id="sync-banner">
  <span class="sb-dot"></span>

async function publishData(){
  if(READ_ONLY){showToast('Modo visualização');return;}
  setSyncStatus('syncing','Salvando...');
  try{
    const r=await fetch(BIN_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({state,comments,people,history,paymentHistory,waContacts,savedAt:Date.now()})});
    if(!r.ok)throw new Error(r.status);
    isDirty=false;
    const _now=new Date();
    const _mo=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    const _fmt=_now.getDate()+'/'+_mo[_now.getMonth()]+' às '+String(_now.getHours()).padStart(2,'0')+':'+String(_now.getMinutes()).padStart(2,'0');
    setSyncStatus('synced','Atualizado '+_fmt);
  }catch(e){setSyncStatus('error','Falha ao salvar — contate o administrador');showToast('⚠️ Falha ao salvar');if(!READ_ONLY)showAdminAlert();}
}
async function loadData(){
  setSyncStatus('syncing','Carregando...');
  try{
    const r=await fetch(BIN_URL+'/latest',{headers:{'X-Bin-Meta':'false'}});
    if(!r.ok)throw new Error(r.status);
    const p=await r.json();
    const BASELINE=1747526400000;
    if(p.savedAt&&p.savedAt>BASELINE){
      if(p.state)Object.keys(p.state).forEach(k=>{state[k]=p.state[k];});
      if(p.comments)Object.keys(p.comments).forEach(k=>{comments[k]=p.comments[k];});
      if(p.people&&p.people.length>0)people.splice(0,people.length,...p.people);
      if(p.history)history.splice(0,history.length,...p.history);
      if(p.paymentHistory)paymentHistory.splice(0,paymentHistory.length,...p.paymentHistory);
      if(p.waContacts)Object.assign(waContacts,p.waContacts);
      const _d=new Date(p.savedAt);
      const _months=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
      const fmt2=_d.getDate()+'/'+_months[_d.getMonth()]+' às '+String(_d.getHours()).padStart(2,'0')+':'+String(_d.getMinutes()).padStart(2,'0');

}

function setFilter(name){activeFilter=name;document.querySelectorAll('.filter-chip').forEach(c=>c.classList.toggle('active',c.dataset.person===name));renderAll();}
function buildFilterBar(){
  const fb=document.getElementById('filter-bar');fb.innerHTML='<span class="filter-bar-label">Filtrar:</span>';
  const all=document.createElement('div');all.className='filter-chip'+(activeFilter==='TODOS'?' active':'');all.dataset.person='TODOS';all.style.cssText='background:rgba(212,168,67,.1);border-color:rgba(212,168,67,.3);color:var(--accent);';all.textContent='Todos';all.onclick=()=>setFilter('TODOS');fb.appendChild(all);

function buildCells(year,month0,prefix){
  const fd=new Date(year,month0,1).getDay(),dim=new Date(year,month0+1,0).getDate(),today=new Date(),isCur=today.getFullYear()===year&&today.getMonth()===month0,cells=[];
  for(let i=0;i<fd;i++)cells.push(null);
  for(let d=1;d<=dim;d++){const key=`${prefix}-${String(d).padStart(2,'0')}`;const dow=new Date(year,month0,d).getDay();if(!state[key])state[key]=[];const hol=HOLIDAYS[key];cells.push({key,label:String(d),dow,dom:dow===0,today:isCur&&today.getDate()===d,empty:false,tags:hol?[{txt:hol}]:[]});}
  const rem=cells.length%7;if(rem)for(let i=0;i<7-rem;i++)cells.push(null);
  return cells;
}
const _tm=(()=>{const t=new Date();return t.getFullYear()===2026&&t.getMonth()===4?t.getDate():null;})();
function getMaioCells(){
  const cells=[null,null,null,{key:'apr-29',label:'29',dow:3,dom:false,today:false,empty:true,tags:[]},{key:'apr-30',label:'30',dow:4,dom:false,today:false,empty:true,tags:[]}];
  for(let d=1;d<=31;d++){const dow=new Date(2026,4,d).getDay();const key=`may-${String(d).padStart(2,'0')}`;if(!state[key])state[key]=[];const hol=HOLIDAYS[key];cells.push({key,label:String(d),dow,dom:dow===0,today:_tm===d,empty:false,tags:hol?[{txt:hol}]:[]});}
  const rem=cells.length%7;if(rem)for(let i=0;i<7-rem;i++)cells.push(null);
  return cells;
}
function hasConflict(key){if(key.startsWith('apr-'))return false;const s=state[key]||[];return s.filter(x=>x.shift==='D').length>1||s.filter(x=>x.shift==='N').length>1;}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sortShifts(k){if(state[k])state[k].sort((a,b)=>a.shift==='D'&&b.shift==='N'?-1:1);}
function renderAll(){
  try{
    buildFilterBar();
    const container=document.getElementById('calendars-container');container.innerHTML='';
    MONTHS_CONFIG.forEach(cfg=>{
      const {prefix,label,year,month0,custom}=cfg;
      const legItems=people.map(p=>{
        const av=p.photo?`<span style="width:18px;height:18px;border-radius:50%;overflow:hidden;display:inline-flex;flex-shrink:0;border:1.5px solid ${p.color};"><img src="${p.photo}" style="width:100%;height:100%;object-fit:cover;"></span>`:`<span style="width:12px;height:12px;border-radius:50%;background:${p.color};display:inline-flex;flex-shrink:0;"></span>`;
        return `<div class="leg">${av}${p.name}</div>`;
      }).join('');
      // Count month totals
    const mStats='';
    container.insertAdjacentHTML('beforeend',`<div class="month-block" id="block-${prefix}"><div class="hdr"><div class="month">${label}</div><div class="yr">2026</div>${mStats}</div><div class="leg-bar">${legItems}<div class="leg" style="margin-left:auto"><span class="ldot" style="background:var(--paid-color);border:1.5px solid var(--paid-light)"></span>Pago<span class="ldot" style="background:var(--pend-color);border:1.5px solid var(--pend-light);margin-left:6px"></span>Pendente</div></div>${READ_ONLY?'':'<div class="hint">✦ arraste para mover · toque para editar · + adicionar ✦</div>'}<div class="cal-wrap"><div class="calendar" id="cal-${prefix}"></div></div></div>`);
      const calEl=document.getElementById('cal-'+prefix);
      DAYS_PT.forEach((d,i)=>{const h=document.createElement('div');h.className='day-hdr'+(i===0?' dom':'');h.textContent=d;calEl.appendChild(h);});
      const cells=custom?getMaioCells():buildCells(year,month0,prefix);
      renderCalendar(calEl,cells);
    });
  }catch(err){console.error('renderAll:',err);document.getElementById('calendars-container').innerHTML=`<div style="padding:24px;color:#e05555;font-size:13px;">Erro: ${err.message}<br><button onclick="location.reload()" style="margin-top:12px;padding:8px 16px;background:var(--accent);color:#000;border:none;border-radius:8px;cursor:pointer;">Recarregar</button></div>`;}
}
function renderCalendar(calEl,cells){
  while(calEl.children.length>7)calEl.removeChild(calEl.lastChild);
  cells.forEach(cell=>{
    const div=document.createElement('div');
    if(!cell){div.className='cell empty';calEl.appendChild(div);return;}
    sortShifts(cell.key);
    div.className='cell'+(cell.empty?' empty':'')+(cell.dom?' dom':'')+(cell.today?' today':'')+(hasConflict(cell.key)&&!cell.empty?' conflict':'');
    div.dataset.key=cell.key;
    const numEl=document.createElement('div');numEl.className='day-num';numEl.textContent=cell.label;div.appendChild(numEl);
    const dowEl=document.createElement('div');dowEl.className='day-dow';dowEl.textContent=DAYS_PT[cell.dow];div.appendChild(dowEl);
    (cell.tags||[]).forEach(tag=>{const t=document.createElement('div');t.className='htag';t.textContent=tag.txt;div.appendChild(t);});
    const cellShifts=state[cell.key]||[];
    let addedD=false,addedN=false;
    cellShifts.forEach((s,idx)=>{
      if(s.shift==='N'&&!addedN&&addedD){
        const divLine=document.createElement('div');divLine.className='shift-divider';div.appendChild(divLine);
        addedN=true;
      }
      if(s.shift==='D')addedD=true;
      const b=makeBadge(s,cell.key,idx);
      if(activeFilter!=='TODOS'&&s.name!==activeFilter)b.classList.add('dimmed');
      div.appendChild(b);
    });
    if(!cell.empty&&!READ_ONLY){
      const ct=comments[cell.key]||'';
      if(ct){const cb=document.createElement('div');cb.className='comment-bubble';cb.innerHTML=`<span class="cb-icon">💬</span><span class="cb-text">${escHtml(ct)}</span><span class="cb-edit">editar</span>`;cb.onclick=e=>{e.stopPropagation();openCommentSheet(cell.key);};div.appendChild(cb);}
      const acb=document.createElement('div');acb.className='add-comment-btn';acb.style.display=ct?'none':'flex';acb.innerHTML='<span>✏︎</span><span>+ comentário</span>';acb.onclick=e=>{e.stopPropagation();openCommentSheet(cell.key);};div.appendChild(acb);
      const ab=document.createElement('div');ab.className='add-btn';ab.textContent='+ adicionar';ab.onclick=e=>{e.stopPropagation();openAddSheet(cell.key,cell.label);};div.appendChild(ab);
    }else if(!cell.empty&&READ_ONLY){
      const ct=comments[cell.key]||'';
      if(ct){const cb=document.createElement('div');cb.className='comment-bubble';cb.innerHTML=`<span class="cb-icon">💬</span><span class="cb-text">${escHtml(ct)}</span>`;div.appendChild(cb);}
    }
    calEl.appendChild(div);
  });
}
function makeBadge(shift,dayKey,idx){
  const b=document.createElement('div');
  const c=getColor(shift.name);
  const shiftBg=shift.shift==='D'?'rgba(255,236,153,0.18)':'rgba(100,149,237,0.15)';
  b.className='badge '+(shift.paid?'paid-print':'pend-print');
  b.style.cssText=`background:${shiftBg};color:${c};border-color:transparent;`;
  b.dataset.dayKey=dayKey;b.dataset.idx=idx;
  const _p=getPerson(shift.name);
  const av=document.createElement('span');av.className='av';
  if(_p.photo){const img=document.createElement('img');img.src=_p.photo;img.style.cssText='width:18px;height:18px;border-radius:50%;object-fit:cover;';av.appendChild(img);}
  else{av.style.cssText=`width:18px;height:18px;border-radius:50%;background:${c};display:flex;align-items:center;justify-content:center;font-size:11px;`;av.textContent='👤';}
  b.appendChild(av);

function buildSummaryData(prefix,label){
  const rows=[];
  const mCfg=MONTHS_CONFIG.find(function(m){return m.prefix===prefix;})||{year:2026,month0:4,label:label||'',prefix:prefix};
  const monthShort=mCfg.label?mCfg.label.substring(0,3):'';
  people.forEach(p=>{
    let dT=0,nT=0,dP=0,nP=0,dPe=0,nPe=0;const days=[];
    Object.keys(state).forEach(key=>{
      if(!key.startsWith(prefix))return;
      (state[key]||[]).forEach(s=>{
        if(s.name!==p.name)return;
        const keyParts=key.split('-');
        const dayNum=parseInt(keyParts[keyParts.length-1]);
        const dow=DAYS_PT[new Date(mCfg.year,mCfg.month0,dayNum).getDay()]||'';
        const dateLabel=dayNum+'/'+monthShort+' ('+dow+')';
        days.push({day:dayNum,dow,dateLabel,shift:s.shift,paid:s.paid});
        if(s.shift==='D'){dT++;s.paid?dP++:dPe++;}else{nT++;s.paid?nP++:nPe++;}
      });
    });
    days.sort(function(a,b){return a.day-b.day;});
    if(dT+nT>0)rows.push({p,dT,nT,dP,nP,dPe,nPe,days,label});
  });
  return rows;
}

function buildMiniCalHTML(cfg,filterName){
  var DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  var html='<div class="mini-cal">';
  DAYS.forEach(function(d,i){html+='<div class="mini-cal-hdr'+(i===0?' dom':'')+'">'+d+'</div>';});
  var fd=new Date(cfg.year,cfg.month0,1).getDay();
  var dim=new Date(cfg.year,cfg.month0+1,0).getDate();
  for(var i=0;i<fd;i++)html+='<div class="mini-day empty"></div>';
  var today=new Date();
  for(var d2=1;d2<=dim;d2++){
    var key=cfg.prefix+'-'+String(d2).padStart(2,'0');
    var allShifts=state[key]||[];
    // Determine background based on filter person's shifts
    var personShifts=filterName?allShifts.filter(function(s){return s.name===filterName;}):allShifts;
    var hasD=personShifts.some(function(s){return s.shift==='D';});
    var hasN=personShifts.some(function(s){return s.shift==='N';});
    var isToday=today.getFullYear()===cfg.year&&today.getMonth()===cfg.month0&&today.getDate()===d2;
    var hasPerson=personShifts.length>0;
    var cls='mini-day'+(hasD&&hasN?' has-dn':hasD?' has-d':hasN?' has-n':'')+(isToday?' today-hl':'');
    html+='<div class="'+cls+'"><div class="mini-day-num">'+d2+'</div><div class="mini-day-dow">'+DAYS[new Date(cfg.year,cfg.month0,d2).getDay()]+'</div>';
    if(filterName){
      // Show filter person highlighted + all others dimmed
      allShifts.forEach(function(s){
        var isMain=s.name===filterName;
        var style=isMain?'font-weight:700;':'opacity:0.5;';
        html+='<div class="mini-person '+(s.shift==='D'?'d-shift':'n-shift')+'" style="'+style+'">'+s.name+'</div>';
      });
    } else {
      allShifts.forEach(function(s){
        html+='<div class="mini-person '+(s.shift==='D'?'d-shift':'n-shift')+'">'+s.name+'</div>';
      });
    }
    html+='</div>';
  }
  html+='</div>';
  return html;
}

function getCompanion(key, shift, personName){
  // Get the other person sharing this day
  var shifts = state[key]||[];
  // If diurno, show who is noturno same day
  // If noturno, show who is diurno same day
  var otherShift = shift==='D'?'N':'D';
  var companion = shifts.filter(function(s){return s.shift===otherShift && s.name!==personName;});
  return companion.map(function(s){return s.name;}).join(', ');
}

      } else if(selectedPeople.size===1){
        printMultiMonth([cfg.prefix],[...selectedPeople][0]);
      } else {
        // Multiple selected - generate one PDF with all selected
        printMultiMonth([cfg.prefix],[...selectedPeople]);
      }
    };
    body.appendChild(pdfBtn);

    // WhatsApp send button
    const waBtn=document.createElement('button');waBtn.className='confirm-btn';waBtn.style.cssText='background:#25d366;color:#fff;margin-bottom:8px;';waBtn.textContent='📲 Enviar link pelo WhatsApp';
    waBtn.onclick=()=>{
      const num=(phoneInp.value||'').replace(/\D/g,'');
      if(!num){showToast('Digite o número');return;}
      const msg=ta.value;
      window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank');
    };
    body.appendChild(waBtn);
    const cancelWA=document.createElement('button');cancelWA.className='cancel-btn';cancelWA.textContent='✕ Fechar';cancelWA.onclick=closeSheet;body.appendChild(cancelWA);
  });
}

function gerarPDFEscala(cfg,filterName){
  // Use exact same function as printMultiMonth with single month
  printMultiMonth([cfg.prefix], filterName||null);
}
function openReminderSheet(){
  openSheet('Lembretes','Lembrete de Turno',body=>{
    const now=new Date();const upcoming=[];
    MONTHS_CONFIG.forEach(cfg=>{
      const cells=cfg.custom?getMaioCells():buildCells(cfg.year,cfg.month0,cfg.prefix);
      cells.forEach(cell=>{
        if(!cell||cell.empty)return;
        const d=new Date(cfg.year,cfg.month0,parseInt(cell.label));const diff=Math.ceil((d-now)/(1000*60*60*24));
        if(diff>=0&&diff<=7)(state[cell.key]||[]).forEach((s,i)=>upcoming.push({cell,s,i,diff,dayKey:cell.key}));
      });
    });
    if(!upcoming.length){body.innerHTML='<div style="text-align:center;color:var(--muted);padding:24px;">Nenhum turno nos próximos 7 dias.</div>';const clsRm=document.createElement('button');clsRm.className='cancel-btn';clsRm.textContent='✕ Fechar';clsRm.onclick=closeSheet;body.appendChild(clsRm);return;}
    const list=document.createElement('div');list.style.cssText='display:flex;flex-direction:column;gap:8px;';
    upcoming.forEach(({cell,s,diff,dayKey})=>{
      const c=getColor(s.name);
      const item=document.createElement('div');
      item.style.cssText='display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;background:#fff;border:1px solid #ddd;';
      const when=diff===0?'Hoje':diff===1?'Amanhã':('Em '+diff+' dias');
      item.innerHTML='<span style="width:32px;height:32px;border-radius:50%;background:'+c+';display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;">👤</span><span style="flex:1;"><div style="font-weight:700;font-size:13px;color:#111;">'+s.name+'</div><div style="font-size:11px;color:#666;margin-top:2px;">'+getDayLabel(dayKey)+' · '+(s.shift==='D'?'☀️':'🌚')+' · '+when+'</div></span>';
      const btn=document.createElement('button');
      btn.style.cssText='margin-left:auto;padding:6px 10px;border-radius:20px;background:#25d366;color:#fff;border:none;cursor:pointer;font-size:10px;white-space:nowrap;flex-shrink:0;';
      btn.textContent='📲 Lembrar';
      btn.onclick=(function(name,dayKey,shift){return function(){
        const num=getPhone(name).replace(/\D/g,'');
        if(!num){showToast('Cadastre o número de '+name);return;}
        const msg='Olá '+name+'! 👋\n\n🔔 Lembrete de turno\n📅 '+getDayLabel(dayKey)+'\n'+(shift==='D'?'☀️':'🌚')+'\n\n🔗 '+window.location.href.split('?')[0]+'?view=1';
        window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank');
      };})(s.name,dayKey,s.shift);
      item.appendChild(btn);list.appendChild(item);
    });
    body.appendChild(list);
    const clsRem=document.createElement('button');clsRem.className='cancel-btn';clsRem.textContent='✕ Fechar';clsRem.onclick=closeSheet;body.appendChild(clsRem);
  });
}

  openSheet('Compartilhar','Links de Acesso',body=>{

function toggleViewTheme(){document.body.classList.toggle('light');const btn=document.getElementById('view-theme-btn');if(btn)btn.textContent=document.body.classList.contains('light')?'📴':'💡';}
function promptAdminLogin(){
  openSheet('Acesso Restrito','Entrar como Admin',body=>{
    const info=document.createElement('div');info.style.cssText='padding:12px;border-radius:12px;background:rgba(212,168,67,.08);border:1px solid rgba(212,168,67,.2);margin-bottom:16px;font-size:11px;color:var(--muted);';info.textContent='Digite a senha para editar a escala.';body.appendChild(info);
    const fg=document.createElement('div');fg.className='form-group';const lbl=document.createElement('div');lbl.className='form-label';lbl.textContent='Senha';
    const inp=document.createElement('input');inp.type='password';inp.className='text-input';inp.placeholder='••••••••';fg.appendChild(lbl);fg.appendChild(inp);body.appendChild(fg);
    const btn=document.createElement('button');btn.className='confirm-btn';btn.textContent='🔐 Entrar';
    btn.onclick=()=>{
      if(inp.value===ADMIN_PASS){
        sessionStorage.setItem('escala_admin',ADMIN_PASS);
        READ_ONLY=false;
        document.body.classList.add('light'); // force light mode immediately
        closeSheet();
        const tbr=document.getElementById('top-bar-right');
        const tmpl=document.getElementById('admin-buttons-template');
        if(tbr&&tmpl)tbr.innerHTML=tmpl.innerHTML;

      }else{

    inp.addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});body.appendChild(btn);setTimeout(()=>inp.focus(),320);

}
let wasDragging=false;
function setupBadgeTap(el,dayKey,idx){
  let tapStart=0,moved=false,sx=0,sy=0;
  el.addEventListener('touchstart',e=>{tapStart=Date.now();moved=false;sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchmove',e=>{if(Math.abs(e.touches[0].clientX-sx)>8||Math.abs(e.touches[0].clientY-sy)>8)moved=true;},{passive:true});
  el.addEventListener('touchend',e=>{if(!moved&&Date.now()-tapStart<350){e.preventDefault();e.stopPropagation();openActionSheet(dayKey,idx);}});
  el.addEventListener('click',e=>{if(!wasDragging){e.stopPropagation();openActionSheet(dayKey,idx);}wasDragging=false;});
}
const confirmOverlay=document.getElementById('confirm-overlay');
const cbTitle=document.getElementById('cb-title');const cbSub=document.getElementById('cb-sub');const cbYes=document.getElementById('cb-yes');const cbNo=document.getElementById('cb-no');
function openDragConfirm(name,fromKey,toKey,onConfirm){
  cbTitle.textContent=`Mover ${name}?`;cbSub.innerHTML=`De <b>${getDayLabel(fromKey)}</b><br>para <b>${getDayLabel(toKey)}</b>`;confirmOverlay.classList.add('open');
  function cleanup(){confirmOverlay.classList.remove('open');cbYes.onclick=null;cbNo.onclick=null;}
  cbYes.onclick=()=>{cleanup();onConfirm();};cbNo.onclick=()=>{cleanup();renderAll();wasDragging=false;};
}
let dragging=null,lastOver=null;
const ghost=document.getElementById('ghost');
function setupDraggable(el,dayKey,idx){el.addEventListener('touchstart',onTouchStart,{passive:false});el.addEventListener('mousedown',onMouseDown);}
function startDrag(el,dayKey,idx,cx,cy){
  const shift=state[dayKey]&&state[dayKey][idx];if(!shift)return;dragging={el,dayKey,idx};setTimeout(()=>el.classList.add('dragging'),80);
  const c=getColor(shift.name);ghost.textContent=`${shift.name} ${shift.shift==='N'?'🌚':'☀️'}`;
  ghost.style.cssText=`display:block;background:rgba(11,11,16,.92);color:${c};border:1px solid ${c}66;border-radius:30px;padding:5px 12px;font-family:'Georgia Pro','Georgia',serif;font-size:12px;font-weight:700;position:fixed;pointer-events:none;z-index:9500;white-space:nowrap;`;
  moveGhost(cx,cy);
}
function moveGhost(x,y){ghost.style.left=(x-ghost.offsetWidth/2)+'px';ghost.style.top=(y-ghost.offsetHeight/2-14)+'px';}
function endDrag(cx,cy){
  if(!dragging)return;ghost.style.display='none';dragging.el.classList.remove('dragging');
  const under=document.elementFromPoint(cx,cy),tc=under?under.closest('.cell[data-key]'):null;
  if(lastOver){lastOver.classList.remove('drag-over');lastOver=null;}
  if(tc&&tc.dataset.key!==dragging.dayKey){
    const fromKey=dragging.dayKey,toKey=tc.dataset.key,idx=dragging.idx,moved=state[fromKey][idx];wasDragging=true;
    openDragConfirm(moved.name,fromKey,toKey,()=>{state[fromKey].splice(idx,1);if(!state[toKey])state[toKey]=[];state[toKey].push(moved);renderAll();markDirty();addHistory(`${moved.name} → ${getDayLabel(toKey)}`);showToast(`${moved.name} movido`);wasDragging=true;});
  }else{renderAll();wasDragging=false;}dragging=null;
}
let touchId=null;
function onTouchStart(e){
  if(e.touches.length>1)return;const el=e.currentTarget;touchId=e.touches[0].identifier;let moved=false;const sx=e.touches[0].clientX,sy=e.touches[0].clientY;
  function tm(ev){let t;for(let x of ev.changedTouches)if(x.identifier===touchId){t=x;break;}if(!t)return;const dx=Math.abs(t.clientX-sx),dy=Math.abs(t.clientY-sy);if(!moved&&(dx>10||dy>10)){moved=true;ev.preventDefault();startDrag(el,el.dataset.dayKey,+el.dataset.idx,sx,sy);}if(moved){ev.preventDefault();moveGhost(t.clientX,t.clientY);const un=document.elementFromPoint(t.clientX,t.clientY),cell=un?un.closest('.cell[data-key]'):null;if(lastOver&&lastOver!==cell)lastOver.classList.remove('drag-over');if(cell&&cell.dataset.key!==el.dataset.dayKey){cell.classList.add('drag-over');lastOver=cell;}else lastOver=null;}}
  function tu(ev){let t;for(let x of ev.changedTouches)if(x.identifier===touchId){t=x;break;}document.removeEventListener('touchmove',tm);document.removeEventListener('touchend',tu);if(moved&&t)endDrag(t.clientX,t.clientY);else{ghost.style.display='none';if(dragging){dragging.el.classList.remove('dragging');dragging=null;}}}
  document.addEventListener('touchmove',tm,{passive:false});document.addEventListener('touchend',tu);
}
function onMouseDown(e){
  if(e.button!==0)return;const el=e.currentTarget;let moved=false;const sx=e.clientX,sy=e.clientY;
  function mm(ev){if(!moved&&(Math.abs(ev.clientX-sx)>6||Math.abs(ev.clientY-sy)>6)){moved=true;wasDragging=true;startDrag(el,el.dataset.dayKey,+el.dataset.idx,sx,sy);}if(moved){moveGhost(ev.clientX,ev.clientY);const un=document.elementFromPoint(ev.clientX,ev.clientY),cell=un?un.closest('.cell[data-key]'):null;if(lastOver&&lastOver!==cell)lastOver.classList.remove('drag-over');if(cell&&cell.dataset.key!==el.dataset.dayKey){cell.classList.add('drag-over');lastOver=cell;}else lastOver=null;}}
  function mu(ev){document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);if(moved)endDrag(ev.clientX,ev.clientY);else{ghost.style.display='none';if(dragging){dragging.el.classList.remove('dragging');dragging=null;}}}
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
}
let toastT;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();publishData();}});
if(READ_ONLY){
  document.addEventListener('DOMContentLoaded',()=>{
    document.body.classList.add('light');
    const tbr=document.getElementById('top-bar-right');
    if(tbr)tbr.innerHTML=`<div style="font-size:10px;color:var(--muted);padding:7px 14px;border:1px solid var(--border);border-radius:20px;">👁 Visualização</div><button id="view-theme-btn" onclick="toggleViewTheme()" style="font-family:'Georgia Pro','Georgia',serif;font-size:10px;padding:7px 12px;border-radius:20px;cursor:pointer;background:var(--surface);border:1px solid var(--border);color:var(--muted);">📴</button><button onclick="promptAdminLogin()" style="font-family:'Georgia Pro','Georgia',serif;font-size:10px;padding:7px 12px;border-radius:20px;cursor:pointer;background:rgba(212,168,67,.1);border:1px solid rgba(212,168,67,.3);color:var(--accent);">🔐 Admin</button>`;
    const fb=document.getElementById('filter-bar');if(fb)fb.style.display='';
  });
}
document.addEventListener('DOMContentLoaded',()=>{
  renderAll();
  loadData();
  if(!READ_ONLY)setInterval(()=>{if(!isDirty)loadData();},60000);
});
