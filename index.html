<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Escala Cuidadores 2026</title>
<style>
/* Georgia Pro — fonte do sistema */
:root{--bg:#0b0b10;--surface:#13131c;--card:#1a1a28;--border:#252535;--border2:#32324a;--text:#e8e4f0;--muted:#5a576e;--accent:#d4a843;--paid-color:#2e7d52;--pend-color:#8b2020;--paid-light:#4caf7d;--pend-light:#e05555;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Georgia Pro','Georgia',serif;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;touch-action:pan-y;}
body.light{
  --bg:#ffffff;--surface:#f2f2f2;--card:#ffffff;--border:#d0d0d0;--border2:#a0a0a0;
  --text:#111111;--muted:#555555;--accent:#9a6800;
  --paid-color:#1a6b3a;--pend-color:#8b0000;--paid-light:#1e8449;--pend-light:#c0392b;
}
body.light .sync-banner{background:#f0f0f0;color:#333;border-bottom:1px solid #d0d0d0;}
body.light .sync-banner.synced{color:#1a6b3a;}
body.light .sync-banner.syncing{color:#9a6800;}
body.light .sync-banner.error{color:#c0392b;}
body.light .top-bar{background:#fff;}
body.light .cloud-badge{background:rgba(154,104,0,.08);border-color:rgba(154,104,0,.25);color:#9a6800;}
body.light .hdr{background:#fff;border-bottom:1px solid #d0d0d0;}
body.light .month{color:#9a6800 !important;}
body.light .yr{color:#555 !important;}
body.light .leg-bar{background:#fff;border-bottom:1px solid #d0d0d0;}
body.light .leg{color:#111;}
body.light .shift-info{background:#fff;color:#555;border-bottom:1px solid #d0d0d0;}
body.light .hint{color:#888;}
body.light .tbtn{background:#f2f2f2;border-color:#d0d0d0;color:#333;}
body.light #view-theme-btn{background:#f2f2f2;border-color:#d0d0d0;color:#333;}
body.light .day-num{color:#333 !important;}
body.light .day-dow{color:#555 !important;}
body.light .cell{background:#fff !important;border-color:#e0e0e0 !important;}
body.light .cell.empty{background:#f8f8f8 !important;opacity:.5;}
body.light .cell.today{background:#fffbef !important;border-color:var(--accent) !important;}
body.light .day-hdr{background:#f2f2f2 !important;color:#333 !important;}
body.light .day-hdr.dom{color:#c0392b !important;}
body.light .hint{color:#888;}
body.light .badge .stg{color:#444 !important;}
body.light .add-btn{color:#aaa;border-color:#ccc;}
body.light .add-comment-btn{color:#888;}
body.light .comment-bubble .cb-text{color:#333 !important;}
body.light .filter-bar{background:#f2f2f2;}
body.light .leg{color:#111;}
body.light .shift-info{color:#555;}
body.light footer{color:#888;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9000;}
/* SYNC */
.sync-banner{display:flex;align-items:center;gap:8px;padding:8px 18px;font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);}
.sync-banner .sb-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s;}
.sync-banner.synced .sb-dot{background:var(--paid-light);box-shadow:0 0 6px var(--paid-light);}
.sync-banner.syncing .sb-dot{background:var(--accent);box-shadow:0 0 6px var(--accent);animation:pulse 1s infinite;}
.sync-banner.error .sb-dot{background:var(--pend-light);}
.sync-banner.synced{color:var(--paid-light);}
.sync-banner.syncing{color:var(--accent);}
.sync-banner.error{color:var(--pend-light);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* TOP BAR */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;gap:8px;flex-wrap:wrap;}
.top-bar-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tbtn{display:flex;align-items:center;gap:5px;font-family:'Georgia Pro','Georgia',serif;font-size:10px;letter-spacing:.8px;padding:7px 12px;border-radius:20px;cursor:pointer;transition:background .15s,border-color .15s,opacity .15s;user-select:none;border:1px solid;}
.tbtn svg{width:13px;height:13px;flex-shrink:0;}
.tbtn-pub{background:var(--paid-color);border-color:var(--paid-light);color:#e8f5ee;}
.tbtn-pub:hover{background:#3a9e68;}
.tbtn-pub:disabled{opacity:.4;cursor:not-allowed;}
.tbtn-print{background:var(--border2);border-color:var(--border);color:var(--text);}
.tbtn-print:hover{border-color:var(--accent);color:var(--accent);}
.tbtn-share{background:rgba(139,114,245,.12);border-color:rgba(139,114,245,.3);color:#a99ef5;}
.tbtn-share:hover{background:rgba(139,114,245,.22);}
.tbtn-cfg{background:rgba(212,168,67,.08);border-color:rgba(212,168,67,.22);color:var(--accent);}
.tbtn-cfg:hover{background:rgba(212,168,67,.18);}
.tbtn-theme{background:var(--surface);border-color:var(--border);color:var(--muted);}
.tbtn-theme:hover{border-color:var(--accent);color:var(--accent);}
.tbtn-summary{background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.3);color:#60a5fa;}
.tbtn-summary:hover{background:rgba(96,165,250,.2);}
.cloud-badge{display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:1px;color:var(--accent);background:rgba(212,168,67,.08);border:1px solid rgba(212,168,67,.2);border-radius:20px;padding:5px 10px;}
/* FILTER BAR */
.filter-bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px;border-bottom:1px solid var(--border);align-items:center;}
.filter-bar-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-right:4px;}
.filter-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:10px;font-family:'Georgia Pro','Georgia',serif;font-weight:700;cursor:pointer;border:1.5px solid transparent;transition:all .15s;user-select:none;opacity:.5;}
.filter-chip.active{opacity:1;box-shadow:0 0 8px rgba(255,255,255,.1);}
.filter-chip .fc-dot{width:7px;height:7px;border-radius:50%;}
/* CALENDAR */
.hdr{padding:10px 18px 16px;display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--border)}
.month{font-family:'Georgia Pro','Georgia',serif;font-size:clamp(38px,10vw,68px);font-weight:800;color:var(--accent);letter-spacing:-2px;line-height:1}
.yr{font-size:11px;letter-spacing:4px;color:var(--muted);padding-bottom:7px}
.leg-bar{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 18px;border-bottom:1px solid var(--border)}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:1px;text-transform:uppercase}
.ldot{width:18px;height:18px;border-radius:50%;flex-shrink:0;}
.leg .ldot{width:9px;height:9px;}
.shift-info{display:flex;gap:16px;padding:7px 18px;border-bottom:1px solid var(--border);font-size:10px;color:var(--muted);letter-spacing:.5px}
.shift-info span{display:flex;align-items:center;gap:5px}
.sdot{width:7px;height:7px;border-radius:50%}
.hint{text-align:center;font-size:9px;letter-spacing:2px;color:var(--muted);padding:7px;text-transform:uppercase}
.month-block{margin-bottom:32px;}
.cal-wrap{padding:0 8px 8px;overflow-x:auto}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(116px,1fr));gap:3px;min-width:700px}
.day-hdr{background:var(--surface);text-align:center;padding:7px 4px;font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.day-hdr.dom{color:#e57272}
.cell{background:var(--card);min-height:118px;padding:7px 6px 6px;display:flex;flex-direction:column;gap:3px;position:relative;border:1.5px solid transparent;transition:background .15s;}
.cell.empty{background:var(--surface);opacity:.28;pointer-events:none}
.cell.today{background:#14142a;border-color:var(--accent);}
body.light .cell.today{background:#fffbef;}
.cell.today .day-num{color:var(--accent);}
.cell.today .day-dow{color:var(--accent);opacity:.9;}
.cell.dom .day-num{color:#e57272}
.cell.today .day-num{color:var(--accent)}
.cell.drag-over{background:#1c1c38;border-color:var(--border2);box-shadow:inset 0 0 0 2px rgba(212,168,67,.3)}
.cell.conflict::before{content:'⚠';position:absolute;top:4px;right:5px;font-size:9px;opacity:.5;color:#f5a87c;}
.day-num{font-family:'Georgia Pro','Georgia',serif;font-size:16px;font-weight:700;color:var(--muted);line-height:1;pointer-events:none}
.day-dow{font-size:8px;color:var(--muted);opacity:.6;letter-spacing:.5px;pointer-events:none;text-transform:uppercase;margin-top:1px;}
.cell.dom .day-dow{color:#e57272;opacity:.8;}
.cell.today .day-dow{color:var(--accent);opacity:.9;}
.day-sub{font-size:8px;color:var(--muted);opacity:.55}
.htag{font-size:8px;letter-spacing:.8px;text-transform:uppercase;color:#e57272;background:rgba(229,114,114,.1);border-radius:3px;padding:2px 5px;pointer-events:none}
.add-btn{margin-top:auto;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--border2);border:1px dashed var(--border2);border-radius:20px;padding:3px 0;text-align:center;cursor:pointer;transition:color .2s,border-color .2s;user-select:none}
.add-btn:hover,.add-btn:active{color:var(--accent);border-color:var(--accent)}
/* COMMENT */
.comment-bubble{display:flex;align-items:flex-start;gap:5px;background:rgba(212,168,67,.07);border:1px solid rgba(212,168,67,.18);border-radius:8px;padding:5px 7px;margin-top:1px;cursor:pointer;transition:background .15s;}
.comment-bubble:hover{background:rgba(212,168,67,.13);}
.comment-bubble .cb-icon{font-size:9px;flex-shrink:0;margin-top:1px;opacity:.7;}
.comment-bubble .cb-text{font-size:9px;color:rgba(232,228,240,.65);line-height:1.4;word-break:break-word;flex:1;font-family:'Georgia Pro','Georgia',serif;}
.comment-bubble .cb-edit{font-size:8px;color:var(--accent);opacity:0;transition:opacity .15s;flex-shrink:0;margin-top:1px;}
.comment-bubble:hover .cb-edit{opacity:1;}
.add-comment-btn{font-size:8px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);opacity:.45;cursor:pointer;padding:1px 0;transition:opacity .2s,color .2s;user-select:none;display:flex;align-items:center;gap:3px;}
.add-comment-btn:hover{opacity:1;color:var(--accent);}
/* BADGE */
.badge{display:flex;align-items:center;gap:4px;padding:4px 7px 4px 5px;border-radius:30px;font-size:11px;font-weight:700;font-family:'Georgia Pro','Georgia',serif;cursor:grab;user-select:none;border:1px solid transparent;touch-action:none;transition:opacity .12s,transform .12s}
.badge:active{cursor:grabbing}
.badge.dragging{opacity:.35;transform:scale(.94)}
.badge.dimmed{opacity:.18;pointer-events:none;}
.badge .av{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;flex-shrink:0;color:#0b0b10;}
.badge .bnm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge .stg{font-size:8px;color:var(--muted);flex-shrink:0}
.badge .pay-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-left:2px;border:1.5px solid transparent}
.badge .pay-dot.paid{background:var(--paid-color);border-color:var(--paid-light)}
.badge .pay-dot.pend{background:var(--pend-color);border-color:var(--pend-light)}
#ghost{position:fixed;pointer-events:none;z-index:9500;display:none;opacity:.88;transform:scale(1.08);box-shadow:0 16px 48px rgba(0,0,0,.55);border-radius:30px;padding:5px 12px;font-family:'Georgia Pro','Georgia',serif;font-size:12px;font-weight:700;white-space:nowrap}
/* SHEET */
.overlay{position:fixed;inset:0;z-index:8000;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:#16162a;border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:20px 20px 36px;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,1,.4,1);border-top:1px solid var(--border2);max-height:90vh;overflow-y:auto;}
body.light .sheet{background:#f0ede4;}
.overlay.open .sheet{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 18px}
.sheet-title{font-family:'Georgia Pro','Georgia',serif;font-size:16px;font-weight:700;color:var(--accent);margin-bottom:16px;letter-spacing:-.5px}
.sheet-day-label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.action-list{display:flex;flex-direction:column;gap:8px}
.action-btn{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'Georgia Pro','Georgia',serif;font-size:12px;cursor:pointer;transition:background .15s;user-select:none}
.action-btn:hover{background:#20203a;}
.action-btn .ico{font-size:16px;width:24px;text-align:center}
.action-btn.danger{color:#f57272}
.action-btn.success{color:var(--paid-light)}
.action-btn.warn{color:var(--pend-light)}
.action-btn.wa{color:#25d366}
.action-btn .sub{font-size:9px;color:var(--muted);letter-spacing:1px;display:block;margin-top:1px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.person-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.person-opt{padding:10px 8px;border-radius:10px;text-align:center;background:var(--card);border:1.5px solid var(--border);font-family:'Georgia Pro','Georgia',serif;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s;user-select:none}
.shift-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shift-opt{padding:10px 8px;border-radius:10px;text-align:center;background:var(--card);border:1.5px solid var(--border);font-family:'Georgia Pro','Georgia',serif;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s;user-select:none;display:flex;align-items:center;justify-content:center;gap:6px}
.shift-opt.sel-D{border-color:#ffd54f;background:rgba(255,213,79,.1);color:#ffd54f}
.shift-opt.sel-N{border-color:#90caf9;background:rgba(144,202,249,.1);color:#90caf9}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay-opt{padding:10px 8px;border-radius:10px;text-align:center;background:var(--card);border:1.5px solid var(--border);font-family:'Georgia Pro','Georgia',serif;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s;user-select:none}
.pay-opt.sel-paid{border-color:var(--paid-light);background:rgba(46,125,82,.15);color:var(--paid-light)}
.pay-opt.sel-pend{border-color:var(--pend-light);background:rgba(139,32,32,.15);color:var(--pend-light)}
.confirm-btn{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#0b0b10;font-family:'Georgia Pro','Georgia',serif;font-size:14px;font-weight:800;border:none;cursor:pointer;margin-top:6px;transition:opacity .15s;letter-spacing:.5px}
.confirm-btn:hover{opacity:.88}
.confirm-btn:disabled{opacity:.35;cursor:not-allowed}
.cancel-btn{width:100%;padding:12px;border-radius:12px;background:transparent;color:var(--muted);font-family:'Georgia Pro','Georgia',serif;font-size:13px;font-weight:700;border:1px solid var(--border);cursor:pointer;margin-top:8px;transition:background .15s;}
.cancel-btn:hover{background:var(--card);}
.text-input{width:100%;padding:12px 14px;border-radius:10px;background:var(--card);border:1.5px solid var(--border2);color:var(--text);font-family:'Georgia Pro','Georgia',serif;font-size:14px;font-weight:700;outline:none;transition:border-color .15s;}
.text-input:focus{border-color:var(--accent);}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:4px;}
.color-swatch{width:100%;aspect-ratio:1;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s,transform .15s;}
.color-swatch.sel{border-color:#fff;transform:scale(1.15);}
/* PEOPLE LIST */
.people-list{display:flex;flex-direction:column;gap:8px;}
.person-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border);}
.person-row .pr-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Georgia Pro','Georgia',serif;font-size:13px;font-weight:800;color:#0b0b10;flex-shrink:0;}
.person-row .pr-name{flex:1;font-family:'Georgia Pro','Georgia',serif;font-size:14px;font-weight:700;}
.person-row .pr-ico{font-size:18px;cursor:pointer;padding:4px;color:var(--muted);transition:color .15s;}
.person-row .pr-ico:hover{color:var(--accent);}
.person-row .pr-del:hover{color:var(--pend-light)!important;}
/* SUMMARY */
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.summary-name{font-family:'Georgia Pro','Georgia',serif;font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.summary-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:4px 0;border-bottom:1px solid var(--border);}
.summary-row:last-child{border-bottom:none;}
.summary-row .sr-label{color:var(--muted);}
.summary-row .sr-val{font-family:'Georgia Pro','Georgia',serif;font-weight:700;}
.summary-row .sr-val.paid{color:var(--paid-light);}
.summary-row .sr-val.pend{color:var(--pend-light);}
.wa-contact-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.wa-contact-row:last-child{border-bottom:none;}
.wa-contact-row .wc-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#0b0b10;flex-shrink:0;}
.wa-contact-row .wc-name{flex:1;font-family:'Georgia Pro','Georgia',serif;font-size:13px;font-weight:700;}
.wa-contact-row input[type=tel]{background:var(--card);border:1px solid var(--border2);color:var(--text);font-family:'Georgia Pro','Georgia',serif;font-size:12px;padding:6px 10px;border-radius:8px;outline:none;width:140px;}
/* HISTORY */
.history-item{padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--border);margin-bottom:8px;}
.history-item .hi-time{font-size:9px;color:var(--muted);letter-spacing:.5px;}
.history-item .hi-msg{font-size:11px;margin-top:3px;}
/* DRAG CONFIRM */
.confirm-overlay{position:fixed;inset:0;z-index:9200;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s;padding:24px;}
.confirm-overlay.open{opacity:1;pointer-events:all;}
.confirm-box{background:#18182e;border-radius:18px;padding:28px 24px 20px;width:100%;max-width:360px;border:1px solid var(--border2);text-align:center;}
.confirm-box .cb-ico{font-size:32px;margin-bottom:12px;}
.confirm-box .cb-title{font-family:'Georgia Pro','Georgia',serif;font-size:15px;font-weight:800;color:var(--text);margin-bottom:6px;}
.confirm-box .cb-sub{font-size:11px;color:var(--muted);letter-spacing:.5px;margin-bottom:20px;line-height:1.5;}
.confirm-box .cb-sub b{color:var(--accent);}
.cb-btns{display:flex;gap:10px;}
.cb-btns button{flex:1;padding:12px;border-radius:12px;font-family:'Georgia Pro','Georgia',serif;font-size:13px;font-weight:800;border:none;cursor:pointer;transition:opacity .15s;}
.cb-btns .cb-yes{background:var(--accent);color:#0b0b10;}
.cb-btns .cb-no{background:var(--card);color:var(--muted);border:1px solid var(--border);}
.cb-btns button:hover{opacity:.85;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--border2);color:var(--text);padding:9px 18px;border-radius:30px;font-size:11px;letter-spacing:1px;z-index:9800;transition:transform .3s ease;pointer-events:none;border:1px solid var(--border);white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}
footer{text-align:center;font-size:9px;letter-spacing:2px;color:var(--muted);padding:10px 10px 20px;text-transform:uppercase;opacity:.4}

/* PRINT */
@media print{
@page{size:A4 landscape;margin:8mm;}
html,body{background:#fff !important;color:#111 !important;font-size:7px;}
body::after,body.light::after{display:none;}
.top-bar,.hint,.overlay,.confirm-overlay,#ghost,#toast,footer,.add-btn,.tbtn,.sync-banner,.cloud-badge,.filter-bar{display:none !important;}
.hdr{padding:4px 8px;border-bottom:1px solid #ccc;}
.month{font-size:28px !important;color:#c8960a !important;}
.yr{color:#888 !important;}

function buildCells(year,month0,prefix){
  const fd=new Date(year,month0,1).getDay(),dim=new Date(year,month0+1,0).getDate();
  const today=new Date(),isCur=today.getFullYear()===year&&today.getMonth()===month0,cells=[];
  for(let i=0;i<fd;i++)cells.push(null);
  for(let d=1;d<=dim;d++){
    const key=`${prefix}-${String(d).padStart(2,'0')}`;
    const dow=new Date(year,month0,d).getDay();
    if(!state[key])state[key]=[];
    const shortKey=`${prefix}-${String(d).padStart(2,'0')}`;
    const hol=HOLIDAYS[shortKey];
    cells.push({key,label:String(d),sub:'',dow,dom:dow===0,today:isCur&&today.getDate()===d,empty:false,tags:hol?[{t:'holiday',txt:hol}]:[]});
  }
  const rem=cells.length%7;if(rem)for(let i=0;i<7-rem;i++)cells.push(null);
  return cells;
}

const _tm=(()=>{const t=new Date();return t.getFullYear()===2026&&t.getMonth()===4?t.getDate():null;})();

}

function hasConflict(key){
  const shifts=state[key]||[];

function setSyncStatus(s,t){const b=document.getElementById('sync-banner');b.className='sync-banner '+s;document.getElementById('sync-text').textContent=t;}

async function publishData(){
  if(READ_ONLY){showToast('Modo visualização');return;}
  const btn=document.getElementById('pub-btn');btn.disabled=true;
  setSyncStatus('syncing','Publicando...');
  try{
    const r=await fetch(BIN_URL,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({state,comments,people,history,paymentHistory,waContacts,savedAt:Date.now()})});
    if(!r.ok)throw new Error(r.status);
    isDirty=false;
    const fmt=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    setSyncStatus('synced',`Publicado às ${fmt}`);
    showToast('☁ Publicado com sucesso!');
  }catch(e){setSyncStatus('error','Erro ao publicar');showToast('⚠️ Erro ao publicar');}
  btn.disabled=false;
}

async function loadData(){
  setSyncStatus('syncing','Carregando da nuvem...');
  try{
    const r=await fetch(BIN_URL+'/latest',{headers:{'X-Bin-Meta':'false'}});
    if(!r.ok)throw new Error(r.status);
    const p=await r.json();
    // Only use cloud data if it was saved after May 18 2026 (our latest local update)
    const BASELINE=1747526400000;
    if(p.savedAt&&p.savedAt>BASELINE){
      if(p.state)Object.keys(p.state).forEach(k=>{state[k]=p.state[k];});
      if(p.comments)Object.keys(p.comments).forEach(k=>{comments[k]=p.comments[k];});
      if(p.people&&p.people.length>0)people.splice(0,people.length,...p.people);
      if(p.history)history.splice(0,history.length,...p.history);
      if(p.waContacts)Object.assign(waContacts,p.waContacts);
      if(p.people)p.people.forEach(person=>{if(!person.phone&&waContacts[person.name])person.phone=waContacts[person.name];});
      if(p.paymentHistory)paymentHistory.splice(0,paymentHistory.length,...p.paymentHistory);
      const fmt=(new Date(p.savedAt)).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      setSyncStatus('synced',`Atualizado ${fmt}`);
    } else {
      setSyncStatus('syncing','Clique Publicar para salvar dados atualizados na nuvem');
      showToast('⚠️ Clique Publicar para atualizar a nuvem');
    }
    renderAll();
  }catch(e){setSyncStatus('error','Usando dados locais');renderAll();}
  if(!READ_ONLY)document.getElementById('pub-btn').disabled=false;
}

// ── SUMMARY ───────────────────────────────────────────
function buildSummaryData(monthPrefix,monthLabel){
  const rows=[];
  people.forEach(p=>{
    let dTotal=0,nTotal=0,dPaid=0,nPaid=0,dPend=0,nPend=0;
    const days=[];
    Object.keys(state).forEach(key=>{
      if(!key.startsWith(monthPrefix))return;
      (state[key]||[]).forEach(s=>{
        if(s.name!==p.name)return;
        const dayNum=parseInt(key.split('-')[2]);
        const cfg=MONTHS_CONFIG.find(m=>m.prefix===monthPrefix);
        const dow=cfg?DAYS_PT[new Date(cfg.year,cfg.month0,dayNum).getDay()]:'';
        days.push({day:dayNum,dow,shift:s.shift,paid:s.paid});
        if(s.shift==='D'){dTotal++;s.paid?dPaid++:dPend++;}
        else{nTotal++;s.paid?nPaid++:nPend++;}
      });
    });
    days.sort((a,b)=>a.day-b.day);
    if(dTotal+nTotal>0)rows.push({p,dTotal,nTotal,dPaid,nPaid,dPend,nPend,days,monthLabel});
  });
  return rows;
}

function getDayLabel(k){

}

const ed=document.createElement(‘span’);ed.className=‘pr-ico’;ed.textContent=‘✏️’;ed.addEventListener(‘click’,()=>openEditPerson(i,rebuild));row.appendChild(ed);
const dl=document.createElement(‘span’);dl.className=‘pr-ico pr-del’;dl.textContent=‘🗑️’;dl.addEventListener(‘click’,()=>{if(people.length<=1){showToast(‘Precisa ter ao menos 1’);return;}const nm2=p.name;people.splice(i,1);renderAll();markDirty();addHistory(`${nm2} removido da lista`);rebuild();showToast(`${nm2} removido`);});row.appendChild(dl);
list.appendChild(row);
});
body.appendChild(list);
const addBtn=document.createElement(‘button’);addBtn.className=‘confirm-btn’;addBtn.style.marginTop=‘16px’;addBtn.textContent=’+ Adicionar Pessoa’;
addBtn.addEventListener(‘click’,()=>openEditPerson(null,rebuild));body.appendChild(addBtn);
}
rebuild();
});
}

function openEditPerson(idx,onDone){
const isNew=idx===null;
const p=isNew?{name:’’,color:PRESET_COLORS[people.length%PRESET_COLORS.length],photo:’’}:{…people[idx]};
let selColor=p.color;
let selPhoto=p.photo||’’;
openSheet(isNew?‘Nova Pessoa’:‘Editar’,isNew?‘Adicionar Pessoa’:‘Editar ‘+p.name,body=>{
// ── PHOTO ──
const fgPhoto=document.createElement(‘div’);fgPhoto.className=‘form-group’;
const lPhoto=document.createElement(‘div’);lPhoto.className=‘form-label’;lPhoto.textContent=‘Foto (opcional)’;
const photoWrap=document.createElement(‘div’);photoWrap.style.cssText=‘display:flex;align-items:center;gap:14px;’;
const photoPreview=document.createElement(‘div’);
photoPreview.style.cssText=‘width:56px;height:56px;border-radius:50%;overflow:hidden;background:’+p.color+’;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;border:2px solid var(–border2);’;
if(selPhoto){const img=document.createElement(‘img’);img.src=selPhoto;img.style.cssText=‘width:100%;height:100%;object-fit:cover;’;photoPreview.appendChild(img);}
else{photoPreview.textContent=‘👤’;}
const photoActions=document.createElement(‘div’);photoActions.style.cssText=‘display:flex;flex-direction:column;gap:8px;flex:1;’;
const pickBtn=document.createElement(‘button’);pickBtn.className=‘cancel-btn’;pickBtn.style.cssText=‘margin:0;font-size:11px;padding:8px;’;pickBtn.textContent=‘📷 Escolher foto’;
const fileInp=document.createElement(‘input’);fileInp.type=‘file’;fileInp.accept=‘image/*’;fileInp.style.display=‘none’;
fileInp.addEventListener(‘change’,()=>{
const file=fileInp.files[0];if(!file)return;
const reader=new FileReader();
reader.onload=e=>{
selPhoto=e.target.result;
photoPreview.innerHTML=’’;
const img=document.createElement(‘img’);img.src=selPhoto;img.style.cssText=‘width:100%;height:100%;object-fit:cover;’;
photoPreview.appendChild(img);
showToast(‘Foto selecionada ✓’);
};
reader.readAsDataURL(file);
});
pickBtn.addEventListener(‘click’,()=>fileInp.click());
const removeBtn=document.createElement(‘button’);removeBtn.className=‘cancel-btn’;removeBtn.style.cssText=‘margin:0;font-size:11px;padding:8px;color:var(–pend-light);’;removeBtn.textContent=‘🗑 Remover foto’;
removeBtn.addEventListener(‘click’,()=>{selPhoto=’’;photoPreview.innerHTML=’’;photoPreview.textContent=‘👤’;showToast(‘Foto removida’);});
photoActions.appendChild(pickBtn);photoActions.appendChild(fileInp);
if(selPhoto)photoActions.appendChild(removeBtn);
photoWrap.appendChild(photoPreview);photoWrap.appendChild(photoActions);
fgPhoto.appendChild(lPhoto);fgPhoto.appendChild(photoWrap);body.appendChild(fgPhoto);
// ── NAME ──
const fg1=document.createElement(‘div’);fg1.className=‘form-group’;const l1=document.createElement(‘div’);l1.className=‘form-label’;l1.textContent=‘Nome’;
const inp=document.createElement(‘input’);inp.type=‘text’;inp.className=‘text-input’;inp.value=p.name;inp.placeholder=‘Ex: João, Tia Maria…’;fg1.appendChild(l1);fg1.appendChild(inp);body.appendChild(fg1);
// ── PHONE ──
const fgPhone=document.createElement(‘div’);fgPhone.className=‘form-group’;
const lPhone=document.createElement(‘div’);lPhone.className=‘form-label’;lPhone.textContent=‘📲 WhatsApp (com DDI, ex: 5511…)’;
const phoneInpEdit=document.createElement(‘input’);phoneInpEdit.type=‘tel’;phoneInpEdit.className=‘text-input’;
phoneInpEdit.placeholder=‘5511999999999’;phoneInpEdit.value=p.phone||waContacts[p.name]||’’;
fgPhone.appendChild(lPhone);fgPhone.appendChild(phoneInpEdit);body.appendChild(fgPhone);
// ── COLOR ──
const fg2=document.createElement(‘div’);fg2.className=‘form-group’;const l2=document.createElement(‘div’);l2.className=‘form-label’;l2.textContent=‘Cor’;
const cg=document.createElement(‘div’);cg.className=‘color-grid’;
PRESET_COLORS.forEach(c=>{const sw=document.createElement(‘div’);sw.className=‘color-swatch’+(c===selColor?’ sel’:’’);sw.style.background=c;sw.addEventListener(‘click’,()=>{selColor=c;photoPreview.style.background=c;cg.querySelectorAll(’.color-swatch’).forEach(s=>s.classList.remove(‘sel’));sw.classList.add(‘sel’);});cg.appendChild(sw);});
fg2.appendChild(l2);fg2.appendChild(cg);body.appendChild(fg2);
// ── SAVE ──
const btn=document.createElement(‘button’);btn.className=‘confirm-btn’;btn.textContent=isNew?‘Adicionar’:‘Salvar’;
btn.addEventListener(‘click’,()=>{
const v=inp.value.trim();if(!v){showToast(‘Digite um nome’);return;}
const personData={name:v,color:selColor,photo:selPhoto,phone:(phoneInpEdit.value||’’).replace(/\D/g,’’)};
if(isNew){people.push(personData);addHistory(`${v} adicionado à lista`);}
else{addHistory(`${p.name} atualizado`);people[idx]=personData;}
renderAll();closeSheet();markDirty();showToast(isNew?`${v} adicionado`:`${v} salvo`);
setTimeout(()=>{openPeopleConfig();if(onDone)onDone();},300);
});
body.appendChild(btn);
const cb=document.createElement(‘button’);cb.className=‘cancel-btn’;cb.textContent=‘Cancelar’;cb.addEventListener(‘click’,()=>{closeSheet();setTimeout(openPeopleConfig,300);});body.appendChild(cb);
setTimeout(()=>inp.focus(),320);
});
}

// ── BADGE TAP ────────────────────────────────────────
let wasDragging=false;
function setupBadgeTap(el,dayKey,idx){
let tapStart=0,moved=false,sx=0,sy=0;
el.addEventListener(‘touchstart’,e=>{tapStart=Date.now();moved=false;sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
el.addEventListener(‘touchmove’,e=>{if(Math.abs(e.touches[0].clientX-sx)>8||Math.abs(e.touches[0].clientY-sy)>8)moved=true;},{passive:true});
el.addEventListener(‘touchend’,e=>{if(!moved&&Date.now()-tapStart<350){e.preventDefault();e.stopPropagation();openActionSheet(dayKey,idx);}});
el.addEventListener(‘click’,e=>{if(!wasDragging){e.stopPropagation();openActionSheet(dayKey,idx);}wasDragging=false;});
}

// ── DRAG ─────────────────────────────────────────────
const confirmOverlay=document.getElementById(‘confirm-overlay’);
const cbTitle=document.getElementById(‘cb-title’);
const cbSub=document.getElementById(‘cb-sub’);
const cbYes=document.getElementById(‘cb-yes’);
const cbNo=document.getElementById(‘cb-no’);
function openDragConfirm(name,fromKey,toKey,onConfirm){
cbTitle.textContent=`Mover ${name}?`;cbSub.innerHTML=`De <b>${getDayLabel(fromKey)}</b><br>para <b>${getDayLabel(toKey)}</b>`;confirmOverlay.classList.add(‘open’);
function cleanup(){confirmOverlay.classList.remove(‘open’);cbYes.onclick=null;cbNo.onclick=null;}
cbYes.onclick=()=>{cleanup();onConfirm();};cbNo.onclick=()=>{cleanup();renderAll();wasDragging=false;};
}

let dragging=null,lastOver=null;
const ghost=document.getElementById(‘ghost’);
function setupDraggable(el,dayKey,idx){el.addEventListener(‘touchstart’,onTouchStart,{passive:false});el.addEventListener(‘mousedown’,onMouseDown);}
function startDrag(el,dayKey,idx,cx,cy){
const shift=state[dayKey]&&state[dayKey][idx];if(!shift)return;dragging={el,dayKey,idx};setTimeout(()=>el.classList.add(‘dragging’),80);
const c=getColor(shift.name);ghost.textContent=`${getInitial(shift.name)} ${shift.name} ${shift.shift==='N'?'🌚':'☀️'}`;
ghost.style.cssText=`display:block;background:rgba(11,11,16,.92);color:${c};border:1px solid ${c}66;border-radius:30px;padding:5px 12px;font-family:'Georgia Pro','Georgia',serif;font-size:12px;font-weight:700;position:fixed;pointer-events:none;z-index:9500;white-space:nowrap;`;moveGhost(cx,cy);
}
function moveGhost(x,y){ghost.style.left=(x-ghost.offsetWidth/2)+‘px’;ghost.style.top=(y-ghost.offsetHeight/2-14)+‘px’;}
function endDrag(cx,cy){
if(!dragging)return;ghost.style.display=‘none’;dragging.el.classList.remove(‘dragging’);
const under=document.elementFromPoint(cx,cy),tc=under?under.closest(’.cell[data-key]’):null;
if(lastOver){lastOver.classList.remove(‘drag-over’);lastOver=null;}
if(tc&&tc.dataset.key!==dragging.dayKey){
const fromKey=dragging.dayKey,toKey=tc.dataset.key,idx=dragging.idx,moved=state[fromKey][idx];wasDragging=true;
openDragConfirm(moved.name,fromKey,toKey,()=>{state[fromKey].splice(idx,1);if(!state[toKey])state[toKey]=[];state[toKey].push(moved);renderAll();markDirty();addHistory(`${moved.name} movido de ${getDayLabel(fromKey)} para ${getDayLabel(toKey)}`);showToast(`${moved.name} movido`);wasDragging=true;});
}else{renderAll();wasDragging=false;}dragging=null;
}
let touchId=null;
function onTouchStart(e){
if(e.touches.length>1)return;const el=e.currentTarget;touchId=e.touches[0].identifier;let moved=false;const sx=e.touches[0].clientX,sy=e.touches[0].clientY;
function tm(ev){let t;for(let x of ev.changedTouches)if(x.identifier===touchId){t=x;break;}if(!t)return;const dx=Math.abs(t.clientX-sx),dy=Math.abs(t.clientY-sy);if(!moved&&(dx>10||dy>10)){moved=true;ev.preventDefault();startDrag(el,el.dataset.dayKey,+el.dataset.idx,sx,sy);}if(moved){ev.preventDefault();moveGhost(t.clientX,t.clientY);const un=document.elementFromPoint(t.clientX,t.clientY),cell=un?un.closest(’.cell[data-key]’):null;if(lastOver&&lastOver!==cell)lastOver.classList.remove(‘drag-over’);if(cell&&cell.dataset.key!==el.dataset.dayKey){cell.classList.add(‘drag-over’);lastOver=cell;}else lastOver=null;}}
function tu(ev){let t;for(let x of ev.changedTouches)if(x.identifier===touchId){t=x;break;}document.removeEventListener(‘touchmove’,tm);document.removeEventListener(‘touchend’,tu);if(moved&&t)endDrag(t.clientX,t.clientY);else{ghost.style.display=‘none’;if(dragging){dragging.el.classList.remove(‘dragging’);dragging=null;}}}
document.addEventListener(‘touchmove’,tm,{passive:false});document.addEventListener(‘touchend’,tu);
}
function onMouseDown(e){
if(e.button!==0)return;const el=e.currentTarget;let moved=false;const sx=e.clientX,sy=e.clientY;
function mm(ev){if(!moved&&(Math.abs(ev.clientX-sx)>6||Math.abs(ev.clientY-sy)>6)){moved=true;wasDragging=true;startDrag(el,el.dataset.dayKey,+el.dataset.idx,sx,sy);}if(moved){moveGhost(ev.clientX,ev.clientY);const un=document.elementFromPoint(ev.clientX,ev.clientY),cell=un?un.closest(’.cell[data-key]’):null;if(lastOver&&lastOver!==cell)lastOver.classList.remove(‘drag-over’);if(cell&&cell.dataset.key!==el.dataset.dayKey){cell.classList.add(‘drag-over’);lastOver=cell;}else lastOver=null;}}
function mu(ev){document.removeEventListener(‘mousemove’,mm);document.removeEventListener(‘mouseup’,mu);if(moved)endDrag(ev.clientX,ev.clientY);else{ghost.style.display=‘none’;if(dragging){dragging.el.classList.remove(‘dragging’);dragging=null;}}}
document.addEventListener(‘mousemove’,mm);document.addEventListener(‘mouseup’,mu);
}

// ── TOAST ────────────────────────────────────────────
let toastT;
function showToast(msg){const t=document.getElementById(‘toast’);t.textContent=msg;t.classList.add(‘show’);clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove(‘show’),2600);}

// ── READONLY ─────────────────────────────────────────
if(READ_ONLY){
document.addEventListener(‘DOMContentLoaded’,()=>{
document.body.classList.add(‘light’); // white background in view mode
const tbr=document.getElementById(‘top-bar-right’);
if(tbr)tbr.innerHTML=`<div style="font-size:10px;color:var(--muted);padding:7px 14px;border:1px solid var(--border);border-radius:20px;">👁 Visualização</div> <button id="view-theme-btn" onclick="toggleViewTheme()" style="display:flex;align-items:center;gap:5px;font-family:'Georgia Pro','Georgia',serif;font-size:10px;letter-spacing:.8px;padding:7px 12px;border-radius:20px;cursor:pointer;background:var(--surface);border:1px solid var(--border);color:var(--muted);">🌑</button> <button onclick="promptAdminLogin()" style="display:flex;align-items:center;gap:5px;font-family:'Georgia Pro','Georgia',serif;font-size:10px;letter-spacing:.8px;padding:7px 12px;border-radius:20px;cursor:pointer;background:rgba(212,168,67,.1);border:1px solid rgba(212,168,67,.3);color:var(--accent);">🔐 Admin</button>`;
const fb=document.getElementById(‘filter-bar’);if(fb)fb.style.display=‘none’;
});
}

function toggleViewTheme(){
const isLight = document.body.classList.toggle(‘light’);
const btn = document.getElementById(‘view-theme-btn’);
if(btn) btn.textContent = isLight ? ‘🌑’ : ‘🌚’;
}

function promptAdminLogin(){
openSheet(‘Acesso Restrito’,‘Entrar como Administrador’,body=>{
const info=document.createElement(‘div’);
info.style.cssText=‘padding:12px 14px;border-radius:12px;background:rgba(212,168,67,.08);border:1px solid rgba(212,168,67,.2);margin-bottom:16px;font-size:11px;color:var(–muted);line-height:1.6;’;
info.textContent=‘Digite a senha de administrador para habilitar a edição da escala.’;
body.appendChild(info);
const fg=document.createElement(‘div’);fg.className=‘form-group’;
const lbl=document.createElement(‘div’);lbl.className=‘form-label’;lbl.textContent=‘Senha’;
const inp=document.createElement(‘input’);inp.type=‘password’;inp.className=‘text-input’;inp.placeholder=’••••••••’;
fg.appendChild(lbl);fg.appendChild(inp);body.appendChild(fg);
const btn=document.createElement(‘button’);btn.className=‘confirm-btn’;btn.textContent=‘🔐 Entrar’;
btn.addEventListener(‘click’,()=>{
if(inp.value===ADMIN_PASS){
// Reload page with admin param
const url=new URL(window.location.href);
url.searchParams.set(‘admin’,ADMIN_PASS);
url.searchParams.delete(‘view’);
window.location.href=url.toString();
} else {
inp.value=’’;
inp.style.borderColor=‘var(–pend-light)’;
showToast(‘⚠️ Senha incorreta’);
setTimeout(()=>inp.style.borderColor=’’,1500);
}
});
inp.addEventListener(‘keydown’,e=>{if(e.key===‘Enter’)btn.click();});
body.appendChild(btn);
setTimeout(()=>inp.focus(),320);
});
}

// ── KEYBOARD ─────────────────────────────────────────
document.addEventListener(‘keydown’,e=>{if((e.ctrlKey||e.metaKey)&&e.key===‘s’){e.preventDefault();publishData();}});

// ── BOOT ─────────────────────────────────────────────
renderAll();
// Only load from cloud if there’s no local override param
// Load cloud data but merge carefully - don’t overwrite if cloud is older
loadData();
if(!READ_ONLY)setInterval(()=>{if(!isDirty)loadData();},60000);
</script>
